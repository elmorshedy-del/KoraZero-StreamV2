<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KoraZero Stream V2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/korazero.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="./watch.html" aria-label="KoraZero">Kora<b>Zero</b></a>
      <span class="badge">Stream V2</span>
      <span class="nav-note">Full IPTV catalog · one upstream test at a time</span>
    </div>
  </header>
  <main class="watch-wrap">
    <div class="container">
      <div class="watch-head">
        <div>
          <h1 class="watch-title" id="channel-title">اختر قناة للتجربة</h1>
          <p class="watch-subtitle">كل القنوات من الكتالوج — التبديل يوقف القناة السابقة أولاً</p>
        </div>
        <span class="badge" id="player-state">IDLE</span>
      </div>
      <div class="layout">
        <section class="card">
          <div class="player-shell" id="player-shell">
            <video id="live-video" controls playsinline preload="metadata"></video>
            <div class="player-overlay"><span class="player-status" id="player-message">اختر قناة من القائمة</span></div>
          </div>
          <div class="panel-body">
            <div class="info-grid">
              <div class="info-item"><small>القناة</small><strong id="channel-id">—</strong></div>
              <div class="info-item"><small>المحرك</small><strong id="player-engine">—</strong></div>
              <div class="info-item"><small>المصدر</small><strong>KoraZero HLS</strong></div>
              <div class="info-item"><small>التحقق</small><strong id="channel-diagnostic">—</strong></div>
            </div>
          </div>
        </section>
        <aside class="card catalog-card">
          <div class="catalog-head">
            <h2>كتالوج القنوات</h2>
            <p id="catalog-count">جاري تحميل الكتالوج…</p>
          </div>
          <div class="catalog-controls">
            <input id="catalog-search" type="search" autocomplete="off" placeholder="ابحث عن قناة…" />
            <select id="catalog-category" aria-label="فلتر الفئة"><option value="">كل الفئات</option></select>
          </div>
          <div class="catalog-list" id="catalog-list" aria-live="polite"></div>
          <button class="catalog-more" id="catalog-more" type="button" hidden>عرض المزيد</button>
        </aside>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
  <script type="module" src="./player/watch-entry.js"></script>
</body>
</html>
