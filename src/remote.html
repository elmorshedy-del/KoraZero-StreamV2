<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>V2 Remote</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b12;color:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b12}
    main{width:min(760px,100%);margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
    h1{font-size:28px;margin:0 0 4px}.sub,.meta,.msg{color:#93a2b8}.sub{margin:0 0 18px}.msg{font-size:13px;line-height:1.45;margin-top:10px}
    .card{background:#0e1623;border:1px solid #243247;border-radius:18px;padding:16px;margin-bottom:14px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
    label{display:block;font-size:13px;color:#93a2b8;margin-bottom:7px}
    input{width:100%;min-height:48px;border-radius:12px;border:1px solid #2a3a52;background:#09101a;color:#fff;padding:0 13px;font-size:16px}
    button{min-height:48px;border-radius:13px;border:1px solid #2b3a4f;background:#151f2e;color:#f5f7fb;font-weight:750;font-size:15px;padding:0 14px;cursor:pointer}
    button.danger{background:#2a131a;color:#ffb0bd;border-color:#6a2c3b}button.primary{background:#18e29a;color:#04110c;border-color:#18e29a}
    button:disabled{opacity:.45;cursor:not-allowed}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .slot{border:1px solid #2a3a52;border-radius:14px;padding:13px}.slot strong{font-size:17px}.slot .meta{font-size:12px;margin:5px 0 10px}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#64748b;margin-right:7px}.dot.on{background:#18e29a}.dot.err{background:#fb7185}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ch{text-align:left;padding:10px 12px}.ch span{display:block;color:#8fa0b7;font-size:12px;margin-top:3px}
    .footer{font-size:12px;color:#68788f;text-align:center;margin-top:10px}
    @media(max-width:520px){.slots,.grid{grid-template-columns:1fr}.sub{font-size:14px}}
  </style>
</head>
<body><main>
  <h1>V2 Remote</h1>
  <p class="sub">Each provider account is an independent slot. Manual choices never silently replace another live slot.</p>

  <section class="card">
    <div class="row">
      <div class="grow"><label for="pin">Operator PIN</label><input id="pin" type="password" autocomplete="current-password" placeholder="Paste once on this device"></div>
      <button id="save" type="button">Save</button>
    </div>
    <div class="msg" id="authMsg">PIN stays on this device only.</div>
  </section>

  <section class="card">
    <div class="slots" id="slots"></div>
    <div class="msg" id="switchMsg">Choose a channel below. With two slots, you will choose which slot should carry it.</div>
  </section>

  <section class="card"><div class="grid" id="grid"></div></section>
  <div class="footer">KoraZero V2 · operator-only · V1/Lab is not part of this control path</div>
</main>
<script>
(() => {
  const channels = [
    ["3645","beIN Sports 1"],["3644","beIN Sports 2"],["3653","beIN Sports 3"],
    ["3652","beIN Sports 4"],["3651","beIN Sports 5"],["89778","Al Kass 1"],
    ["89779","Al Kass 2"],["677","ON Sport HD"],["244603","Shasha Sport 2"]
  ];
  const pin = document.getElementById("pin"), save = document.getElementById("save");
  const slotsEl = document.getElementById("slots"), grid = document.getElementById("grid");
  const authMsg = document.getElementById("authMsg"), switchMsg = document.getElementById("switchMsg");
  let state = null, busy = false;
  pin.value = localStorage.getItem("kz_v2_operator_pin") || "";

  function headers(){return{"x-operator-pin":pin.value.trim()}}
  async function api(path,options={}){
    const response=await fetch(path,{cache:"no-store",...options,headers:{...headers(),...(options.headers||{})}});
    const body=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(body.detail||body.error||("HTTP "+response.status));
    return body;
  }
  function normalizedSlots(){
    if(Array.isArray(state?.slots)&&state.slots.length)return state.slots;
    return [{slot:"a",channelId:state?.active?.channelId||null,streamId:state?.active?.streamId||null,
      inputs:state?.active?.inputs||0,viewers:state?.active?.viewers||0,mode:"manual"}];
  }
  function labelFor(streamId){return channels.find(([id])=>id===String(streamId))?.[1]||("iptv-"+streamId)}
  function setBusy(value,message=""){
    busy=value;document.querySelectorAll("button").forEach(b=>b.disabled=value);
    if(message)switchMsg.textContent=message;
  }
  async function offSlot(slot){
    if(busy)return;
    setBusy(true,"Turning Slot "+slot.toUpperCase()+" off…");
    try{await api("/operator/off?slot="+encodeURIComponent(slot),{method:"POST"});await refresh();}
    catch(error){switchMsg.textContent="Off failed: "+error.message}finally{setBusy(false)}
  }
  async function resumeAuto(slot){
    if(busy)return;
    setBusy(true,"Resuming automatic control on Slot "+slot.toUpperCase()+"…");
    try{await api("/operator/resume-auto?slot="+encodeURIComponent(slot),{method:"POST"});await refresh();}
    catch(error){switchMsg.textContent="Resume failed: "+error.message}finally{setBusy(false)}
  }
  function renderSlots(){
    slotsEl.replaceChildren();
    const slots=normalizedSlots();
    slots.forEach(s=>{
      const box=document.createElement("div");box.className="slot";
      const title=document.createElement("strong");
      title.innerHTML='<span class="dot '+(s.channelId?"on":"")+'"></span>Slot '+String(s.slot).toUpperCase();
      const name=document.createElement("div");name.textContent=s.channelId?labelFor(s.streamId):"Off";
      const meta=document.createElement("div");meta.className="meta";
      meta.textContent=s.channelId?(s.channelId+" · inputs "+(s.inputs||0)+" · viewers "+(s.viewers||0)+" · "+(s.mode||"auto")):("No live input · "+(s.mode||"auto"));
      const controls=document.createElement("div");controls.className="row";
      const off=document.createElement("button");off.className="danger";off.textContent="Off";off.addEventListener("click",()=>offSlot(s.slot));
      controls.appendChild(off);
      if(s.mode==="manual"){
        const resume=document.createElement("button");resume.textContent="Resume Auto";resume.addEventListener("click",()=>resumeAuto(s.slot));controls.appendChild(resume);
      }
      box.append(title,name,meta,controls);slotsEl.appendChild(box);
    });
  }
  function chooseSlot(){
    const slots=normalizedSlots();
    if(slots.length===1)return slots[0].slot;
    const free=slots.filter(s=>!s.channelId);
    if(free.length===1)return free[0].slot;
    const summary=slots.map(s=>s.slot.toUpperCase()+": "+(s.channelId?labelFor(s.streamId):"free")).join("\n");
    const choice=window.prompt("Choose V2 slot (a or b). A busy slot will be explicitly replaced:\n"+summary,"a");
    if(!choice)return null;
    const normalized=choice.trim().toLowerCase();
    return slots.some(s=>s.slot===normalized)?normalized:null;
  }
  async function switchTo(id,label){
    if(busy)return;if(!pin.value.trim()){authMsg.textContent="Enter the operator PIN first.";pin.focus();return}
    const slot=chooseSlot();if(!slot){switchMsg.textContent="No slot selected.";return}
    setBusy(true,"Switching Slot "+slot.toUpperCase()+" to "+label+"…");
    try{
      const result=await api("/operator/switch/"+encodeURIComponent(id)+"?slot="+encodeURIComponent(slot),{method:"POST"});
      switchMsg.textContent=result.alreadyActive?label+" was already live on Slot "+String(result.slot||slot).toUpperCase()+".":label+" is live and verified on Slot "+slot.toUpperCase()+".";
      await refresh();
    }catch(error){switchMsg.textContent="Switch failed: "+error.message}finally{setBusy(false)}
  }
  function renderChannels(){
    grid.replaceChildren();channels.forEach(([id,label])=>{
      const b=document.createElement("button");b.className="ch";b.type="button";
      b.innerHTML="<strong>"+label+"</strong><span>iptv-"+id+"</span>";b.addEventListener("click",()=>switchTo(id,label));grid.appendChild(b);
    });
  }
  async function refresh(){
    if(!pin.value.trim()){authMsg.textContent="Enter operator PIN.";state=null;renderSlots();return}
    try{
      state=await api("/operator/active");authMsg.textContent=state.conflict?"Controller reports a slot ownership conflict.":"Connected.";
      renderSlots();
    }catch(error){state=null;authMsg.textContent=error.message==="unauthorized"?"Wrong operator PIN.":error.message;renderSlots()}
  }
  save.addEventListener("click",()=>{
    const value=pin.value.trim();if(value)localStorage.setItem("kz_v2_operator_pin",value);else localStorage.removeItem("kz_v2_operator_pin");
    refresh();
  });
  renderChannels();refresh();
})();
</script></body></html>
