services:
  mistserver:
    image: ddvtech/mistserver:latest
    restart: unless-stopped
    shm_size: 4gb
    ports:
      - "8080:8080"
      - "127.0.0.1:4242:4242"
    healthcheck:
      test: ["CMD", "MistUtilHealth"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
